<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Productos | Bloom Admin</title>

<link rel="stylesheet" href="../assets/css/variables.css">
<link rel="stylesheet" href="../assets/css/admin.css">

</head>


<body class="admin-panel">


<aside class="sidebar">

<img src="../assets/img/logo.svg" alt="Bloom">


<nav>

<a href="dashboard.html">Dashboard</a>
<a href="productos.html">Productos</a>
<a href="pedidos.html">Pedidos</a>
<a href="clientes.html">Clientes</a>
<a href="categorias.html">Categorías</a>
<a href="promociones.html">Promociones</a>
<a href="reportes.html">Reportes</a>
<a href="configuracion.html">Configuración</a>

</nav>

</aside>



<main class="admin-content">


<header class="admin-header">

<h1>
Productos Bloom
</h1>

<p>
Administra tus flores y arreglos.
</p>

</header>




<section class="product-admin-form">


<h2>
Nuevo producto
</h2>


<form id="productForm">


<input 
id="productName"
type="text"
placeholder="Nombre del producto"
required
>



<input 
id="productPrice"
type="number"
placeholder="Precio"
required
>



<select id="productCategory">

<option value="">
Seleccionar categoría
</option>

<option value="Ramos">
Ramos
</option>

<option value="Arreglos">
Arreglos
</option>

<option value="Regalos">
Regalos
</option>

</select>



<textarea
id="productDescription"
placeholder="Descripción del producto">
</textarea>



<label>
Imagen del producto
</label>

<input 
id="productImage"
type="file"
accept="image/*"
>



<select id="productStatus">

<option value="disponible">
Disponible
</option>

<option value="agotado">
Agotado
</option>

</select>



<button type="submit">
Guardar producto
</button>


</form>


</section>





<section class="products-list">


<h2>
Productos registrados
</h2>


<div class="empty-state">

🌸

<p>
Aún no hay productos creados.
</p>

</div>


</section>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../assets/js/supabase.js"></script>

<script src="../assets/js/productsadmin.js"></script>


</body>

</html>
