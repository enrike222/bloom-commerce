<body class="admin-panel">


<aside class="sidebar">

<img src="../assets/img/logo.svg" alt="Bloom">


<nav>

<main class="admin-content">


<header class="admin-header">

<h1>
Productos Bloom
</h1>

<p>
Administra tus flores y arreglos.
</p>

</header>




<section class="product-admin-form">


<h2>
Nuevo producto
</h2>


<form>


<input 
type="text"
placeholder="Nombre del producto"
>



<input 
type="number"
placeholder="Precio"
>



<select>

<option>
Seleccionar categoría
</option>

<option>
Ramos
</option>

<option>
Arreglos
</option>

<option>
Regalos
</option>

</select>



<textarea
placeholder="Descripción del producto">
</textarea>



<label>
Imagen del producto
</label>

<input 
type="file"
>



<select>

<option>
Disponible
</option>

<option>
Agotado
</option>

</select>



<button>
Guardar producto
</button>


</form>


</section>





<section class="products-list">


<h2>
Productos registrados
</h2>


<div class="empty-state">

🌸

<p>
Aún no hay productos creados.
</p>

</div>


</section>
