<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Bloom | Productos</title>



<link rel="stylesheet" href="../assets/css/variables.css">

<link rel="stylesheet" href="../assets/css/base.css">

<link rel="stylesheet" href="../assets/css/buttons.css">

<link rel="stylesheet" href="../assets/css/cards.css">

<link rel="stylesheet" href="../assets/css/animations.css">

<link rel="stylesheet" href="../assets/css/sidebar.css">

<link rel="stylesheet" href="../assets/css/admin.css">


</head>



<body class="admin-panel">



<!-- SIDEBAR -->

<div id="sidebar-container"></div>




<main class="admin-content">



<header class="page-header">


<h1>
🌸 Productos Bloom
</h1>


<p>
Administra tus productos, precios e imágenes.
</p>


</header>





<section class="product-admin-form">


<h2>
Agregar producto
</h2>




<form id="productForm">



<input 
type="text"
id="productName"
placeholder="Nombre del producto"
required>




<input 
type="number"
id="productPrice"
placeholder="Precio"
required>





<select id="productCategory" required>


<option value="">
Selecciona categoría
</option>


<option value="Ramos">
Ramos
</option>


<option value="Arreglos">
Arreglos
</option>


<option value="Eventos">
Eventos
</option>


<option value="Regalos">
Regalos
</option>


</select>





<textarea
id="productDescription"
placeholder="Descripción">
</textarea>





<input 
type="file"
id="productImage"
accept="image/*">





<select id="productStatus">


<option value="disponible">
Disponible
</option>


<option value="agotado">
Agotado
</option>


</select>




<button id="saveProductBtn"
type="submit">

Guardar producto

</button>



<button 
id="cancelEditBtn"
type="button"
style="display:none;">


Cancelar edición


</button>



</form>


</section>





<section class="products-list">


<h2>
Productos registrados
</h2>



<div id="productsContainer">


</div>



</section>




</main>







<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script src="../assets/js/supabase.js"></script>


<script src="../assets/js/components.js"></script>


<script src="../assets/js/productsadmin.js"></script>



</body>

</html>
