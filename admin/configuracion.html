Configuración Bloom

<section class="settings-panel">


<h2>
Información de la tienda
</h2>


<form>


<label>
Nombre de la tienda
</label>

<input 
type="text"
value="Bloom Floristería"
>



<label>
WhatsApp
</label>

<input 
type="text"
placeholder="+502 XXXX XXXX"
>



<label>
Instagram
</label>

<input 
type="text"
placeholder="@bloomfloristeria.gt"
>



<label>
Dirección
</label>

<input 
type="text"
placeholder="Dirección de la tienda"
>



<label>
Horario de atención
</label>

<textarea
placeholder="Lunes a sábado 9:00 AM - 6:00 PM">
</textarea>



<button>
Guardar cambios
</button>


</form>
